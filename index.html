
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สภานักเรียน | Student Council</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#182b45}
header{background:#102b50;color:white;padding:30px 7%}
header h1{margin:0 0 10px}
header p{color:#c8d9ef}
nav{background:white;padding:15px 7%;box-shadow:0 2px 8px #0001}
nav a{color:#173b67;text-decoration:none;margin-right:20px}
main{max-width:1100px;margin:35px auto;padding:0 18px}
.hero{background:#dceeea;padding:28px;border-radius:18px;margin-bottom:25px}
.hero h2{font-size:30px;margin-top:0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input,select{padding:12px;border:1px solid #ccd5e1;border-radius:10px;font-size:16px;background:white}
input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #102b500d}
.avatar{width:76px;height:76px;border-radius:50%;background:#dceeea;display:grid;place-items:center;font-size:30px;margin-bottom:14px}
.role{color:#147b69;font-size:14px}
button{background:#173b67;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-size:15px}
button:hover{background:#23558d}
footer{text-align:center;padding:30px;color:#65748a}
dialog{border:0;border-radius:18px;padding:28px;width:min(440px,90%);box-shadow:0 10px 50px #0003}
dialog::backdrop{background:#102b5080}
</style>
</head>
<body>
<header>
  <h1>🎓 STUDENT COUNCIL</h1>
  <p id="school">เว็บไซต์สภานักเรียน • ปีการศึกษา 2569</p>
</header>
<nav>
  <a href="#">หน้าแรก</a>
  <a href="#members">สมาชิกสภานักเรียน</a>
</nav>
<main>
  <section class="hero">
    <h2>เสียงของนักเรียน พลังแห่งการเปลี่ยนแปลง</h2>
    <p>รู้จักทีมสภานักเรียน ผู้พร้อมรับฟังและพัฒนาโรงเรียนไปด้วยกัน</p>
  </section>

  <h2 id="members">สมาชิกสภานักเรียน</h2>
  <p id="count"></p>
  <div class="controls">
    <input id="search" placeholder="🔎 ค้นหาชื่อสมาชิก..." />
    <select id="filter">
      <option value="">ทุกตำแหน่ง</option>
      <option>ประธานนักเรียน</option>
      <option>รองประธานนักเรียน</option>
      <option>เลขานุการ</option>
      <option>ฝ่ายกิจกรรม</option>
      <option>ฝ่ายประชาสัมพันธ์</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>© 2569 สภานักเรียน | เว็บไซต์ประชาสัมพันธ์โรงเรียน</footer>

<dialog id="detail">
  <div id="detailContent"></div>
  <button onclick="document.getElementById('detail').close()">
    ปิดหน้าต่าง
  </button>
</dialog>

<script>
// แก้ไขข้อมูลสมาชิกจริงได้ในรายการนี้
const members = [
 {name:"สมาชิกตัวอย่าง 01",role:"ประธานนักเรียน",room:"ม.6/1",
  bio:"รับฟังความคิดเห็นของนักเรียนและประสานงานกับโรงเรียน",
  work:"ดูแลการดำเนินงานของสภานักเรียน"},
 {name:"สมาชิกตัวอย่าง 02",role:"รองประธานนักเรียน",room:"ม.5/1",
  bio:"สนับสนุนการทำงานของประธานและสมาชิกทุกฝ่าย",
  work:"ประสานงานและติดตามโครงการ"},
 {name:"สมาชิกตัวอย่าง 03",role:"เลขานุการ",room:"ม.5/2",
  bio:"ดูแลเอกสารและบันทึกการประชุม",
  work:"จัดทำรายงานการประชุม"},
 {name:"สมาชิกตัวอย่าง 04",role:"ฝ่ายกิจกรรม",room:"ม.4/1",
  bio:"ร่วมสร้างสรรค์กิจกรรมที่เป็นประโยชน์",
  work:"วางแผนและจัดกิจกรรมในโรงเรียน"},
 {name:"สมาชิกตัวอย่าง 05",role:"ฝ่ายประชาสัมพันธ์",room:"ม.4/2",
  bio:"เผยแพร่ข่าวสารและกิจกรรมของสภานักเรียน",
  work:"ดูแลข่าวสารและสื่อประชาสัมพันธ์"}
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const filter = document.getElementById("filter");

function render(){
  const q = search.value.trim().toLowerCase();
  const list = members.filter(m =>
    (m.name.toLowerCase().includes(q) ||
     m.role.toLowerCase().includes(q) ||
     m.room.toLowerCase().includes(q)) &&
    (!filter.value || m.role === filter.value)
  );
  document.getElementById("count").textContent =
    `พบสมาชิก ${list.length} คน`;

  grid.innerHTML = "";
  if(!list.length){
    grid.innerHTML = "<p>ไม่พบสมาชิกที่ค้นหา</p>";
    return;
  }

  list.forEach(m => {
    const card = document.createElement("article");
    card.className = "card";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "👤";
    const name = document.createElement("h3");
    name.textContent = m.name;
    const role = document.createElement("p");
    role.className = "role";
    role.textContent = m.role;
    const room = document.createElement("p");
    room.textContent = "ห้องเรียน: " + m.room;
    const btn = document.createElement("button");
    btn.textContent = "ดูข้อมูลสมาชิก";
    btn.onclick = () => showDetail(m);
    card.append(avatar,name,role,room,btn);
    grid.append(card);
  });
}

function showDetail(m){
  const content = document.getElementById("detailContent");
  content.replaceChildren();
  const title = document.createElement("h2");
  title.textContent = m.name;
  content.append(title);
  [["ตำแหน่ง",m.role],["ห้องเรียน",m.room],
   ["ประวัติ",m.bio],["หน้าที่และผลงาน",m.work]]
   .forEach(([label,value]) => {
     const p = document.createElement("p");
     const strong = document.createElement("strong");
     strong.textContent = label + ": ";
     p.append(strong,document.createTextNode(value));
     content.append(p);
   });
  document.getElementById("detail").showModal();
}

search.addEventListener("input",render);
filter.addEventListener("change",render);
render();
</script>
</body>
</html>
